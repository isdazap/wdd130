<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz Form</title>
    <meta name="description"
      content="Exercise to create a poll form and styling it with CSS.">
    <meta name="author" content="Isaac Daza">
    <!-- <link rel="stylesheet" href="styles/quiz.css"> -->
</head>
<body>
    <header>
        <h1>✅Basic HTML and CSS Quiz</h1>
    </header>
    <main>
        <form>
            <fieldset>

                <div class="quiz-item">
                    <label for="q1">1. What does the acronym CSS stand for?</label>
                    <input type="text" id="q1" name="q1">
                </div>

                <div class="quiz-item">
                    <label for="q2">2. How are id and class attributes selected in CSS?</label>
                    <textarea id="q2" name="q2" rows="4" placeholder="Canada, North Carolina, Amsterdam..."></textarea>
                </div>

                <div class="quiz-item">
                    <label for="q3">3. Which of the following is a valid CSS comment?</label>
                    <select id="q3" name="q3">
                        <option value="" selected disabled>Choose One ...</option>
                        <option value="a">A. # This is a CSS comment</option>
                        <option value="b">B. /* This is a CSS comment */</option>
                        <option value="c">C. // This is a CSS comment</option>
                    </select>
                </div>

                <div class="quiz-item">
                    <label for="q4">4. What is the bottom margin given this declaration?</label>
                    <code>margin: 10px 5px 15px;</code>
                    <input type="number" id="q4" name="q4">
                </div>
            
            </fieldset>

                <button type="submit">Submit Quiz</button>
        </form>

    </main>
    <footer>
        <p>©2026 - Colombia - Isaac Daza</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WWD 130 | HTML Poll Form</title>
    <meta name="description"
      content="Exercise to create a poll form and styling it with CSS.">
    <meta name="author" content="Isaac Daza">
    <link rel="stylesheet" href="styles/poll-form.css">
</head>
<body>
    <header>
        <h1>WWD 130 | HTML Poll Form</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item column2">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname">
                </div>
                <div class="form-item column2">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail">
                </div>
            </fieldset>

            <fieldset>
                <legend>Questions</legend>
                <div class="form-item column1">
                    <label for="browser">What is your favorite browser?</label>
                    <select id="browser" name="browser">
                        <option value="chrome">Google Chrome</option>
                        <option value="firefox">Mozilla Firefox</option>
                        <option value="safari">Apple Safari</option>
                        <option value="edge">Microsoft Edge</option>
                        <option value="opera">Opera</option>
                    </select>
                </div>
                <div class="form-item column1">
                    <label><input type="checkbox" id="pet" name="pet"> Do you have a Household Pet?</label>
                </div>
                <label for="places lived">List the places you have lived:</label>
                <textarea id="feedback" name="feedback" rows="4" placeholder="Canada, North Carolina, Amsterdam..."></textarea>
            </fieldset> 
                <button type="submit">Submit Poll</button>
        </form>

    </main>
    <footer>
        <p>©2026 - Colombia - Isaac Daza</p>
    </footer>
</body>
</html>

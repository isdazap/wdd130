<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us The Whitewater Rafting - Colombia</title>
    <meta name="description"
      content="Whitewater rafting in Colombia web site offering thrilling experiences on the country's beautiful rivers to individuals and groups for a fee.">
    <meta name="author" content="Isaac Daza">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="./images/rafting.png" alt="Rafting Logo" width="200">
        <nav class="flex">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html" >Trips</a>
            <a href="contact.html" >Contact Us</a>
        </nav>

    </header>
    <main>
        <div class="hero">
            <h1>The Whitewater Rafting - Colombia</h1>
        </div>
        <div class="contact-info">
            <p>123 Main River Street, Suite 456</p>
            <p>Bogota, Colombia</p>
            <p>Phone: +57 123 456 7890</p>
            <p>info@whitewaterrrafting.com</p>
        </div>
        <section class="client-info">
            <div id="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d14596.19470908369!2d-73.5957829217907!3d4.1581299681195505!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2sco!4v1791391991547!5m2!1ses-419!2sco" 
                width="450" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>              
            <form>
                <div class="form-item">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name">
                </div>
                <div class="form-item">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="youremail@email.com">
                </div>
                <div class="form-item">
                    <span>Message Purpose:</span>
                    <div class="radio-options">
                        <label><input type="radio" id='general' name="purpose" value="general"> General Inquiry</label>
                        <label><input type="radio" id='reservation' name="purpose" value="reservation"> Reservation Question</label>
                        <label><input type="radio" id='suggestion' name="purpose" value="suggestion"> Website Suggestion</label>
                    </div>
                </div>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Type here"></textarea>
                <div class="checkbox">
                    <label><input type="checkbox" id="newsletter" name="newsletter"> Please subscribe me to the monthly newsletter</label>
                </div> 
                <button type="submit">Get in Touch!</button>
            </form>

        </section>
        <section class="adventure">
            <h2>Adventure Awaits You!</h2>  
            <figure>
                <img src="images/river-1.jpg" alt="Rio Cauca">
                <figcaption>Rio Cauca</figcaption>
            </figure> 
            <figure>   
                <img src="images/river-2.jpg" alt="Rio Magdalena">
                <figcaption>Rio Magdalena</figcaption>
            </figure>    
            <figure>    
                <img src="images/river-3.jpeg" alt="Río Atrato">
                <figcaption>Río Atrato</figcaption>
            </figure>
            <figure>    
                <img src="images/river-4.jpeg" alt="Rio Negro">
                <figcaption>Rio Negro</figcaption>
            </figure>  
            <figure>    
                <img src="images/river-5.jpg" alt="Ríos del Orinoco">
                <figcaption>Ríos del Orinoco</figcaption>
            </figure>        
        </section>

    </main>

    
    <footer>
        <p>©2026 * The Whitewater Rafting - Colombia * Isaac Daza</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener" ><img src="./images/facebook-logo.png" alt="Facebook page" width="30" ></a>
            <a href="https://instagram.com" target="_blank" rel="noopener" ><img src="./images/instagram-logo.png" alt="Instagram page" width="30" ></a>
            <a href="https://whatsapp.com" target="_blank" rel="noopener" ><img src="./images/whatsapp-logo.png" alt="WhatsApp page" width="30" ></a>
        </nav>
    </footer>
</body>
</html>
